<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091720"/>
      <stop offset="100%" stop-color="#040b10"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efa75c"/>
      <stop offset="100%" stop-color="#58d1be"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="8" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="448" rx="7" fill="none" stroke="#efa75c" stroke-opacity="0.25"/>

  <!-- Top bar -->
  <rect x="30" y="25" width="740" height="35" rx="5" fill="#132735" fill-opacity="0.6"/>
  <circle cx="50" cy="42" r="5" fill="#efa75c" fill-opacity="0.8"/>
  <circle cx="68" cy="42" r="5" fill="#58d1be" fill-opacity="0.8"/>
  <circle cx="86" cy="42" r="5" fill="#aebfc0" fill-opacity="0.5"/>
  <text x="110" y="47" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" fill="#aebfc0">videlto.online — Automated 9:16 Commercial Video Ad Studio</text>

  <!-- Left: Static Product Photo Input -->
  <g transform="translate(60, 95)">
    <rect width="210" height="270" rx="6" fill="#112431" stroke="#aebfc0" stroke-opacity="0.3"/>
    <rect x="15" y="15" width="180" height="28" rx="3" fill="#183446"/>
    <text x="25" y="34" font-family="sans-serif" font-size="11" fill="#aebfc0" font-weight="600">Raw Static Product Photo</text>
    
    <!-- Camera/Shoe outline mock -->
    <rect x="25" y="60" width="160" height="150" rx="4" fill="#0d1c26"/>
    <circle cx="105" cy="135" r="45" fill="none" stroke="#efa75c" stroke-width="2"/>
    <circle cx="105" cy="135" r="30" fill="none" stroke="#58d1be" stroke-width="1.5"/>
    <text x="75" y="140" font-family="sans-serif" font-size="10" fill="#aebfc0">DTC Catalog</text>
    
    <text x="25" y="235" font-family="sans-serif" font-size="10" fill="#efa75c">Feature Deconstruction</text>
    <text x="25" y="250" font-family="sans-serif" font-size="9" fill="#aebfc0">Editorial palette + dynamic hook</text>
  </g>

  <!-- Center: AI Rendering Pipeline -->
  <g transform="translate(295, 175)">
    <path d="M10 40 L65 40 M55 30 L67 40 L55 50" stroke="#efa75c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="0" y="0" width="90" height="28" rx="4" fill="#1a3547" stroke="#58d1be" stroke-opacity="0.5"/>
    <text x="15" y="18" font-family="sans-serif" font-size="9" fill="#58d1be" font-weight="bold">Render &lt; 10s</text>
    <text x="-5" y="75" font-family="sans-serif" font-size="9" fill="#aebfc0">Cloudflare Edge</text>
  </g>

  <!-- Right: 9:16 Vertical Video Output (Mobile Mock) -->
  <g transform="translate(415, 80)">
    <!-- Phone frame -->
    <rect width="185" height="320" rx="20" fill="#08141c" stroke="#58d1be" stroke-width="2"/>
    <!-- Screen -->
    <rect x="8" y="15" width="169" height="290" rx="14" fill="#142836"/>
    <!-- Top notch -->
    <rect x="62" y="18" width="60" height="10" rx="5" fill="#08141c"/>

    <!-- Video ad content -->
    <rect x="18" y="35" width="149" height="150" rx="6" fill="#1c3a4e"/>
    <circle cx="92" cy="110" r="35" fill="none" stroke="#efa75c" stroke-width="3"/>
    <polygon points="87,100 102,110 87,120" fill="#58d1be"/>

    <text x="25" y="205" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="bold">Kinetic Typography</text>
    <text x="25" y="222" font-family="sans-serif" font-size="9" fill="#58d1be">"Engineered for high CTR"</text>

    <!-- Ad CTA -->
    <rect x="25" y="240" width="135" height="30" rx="15" fill="url(#glow)"/>
    <text x="50" y="260" font-family="sans-serif" font-size="11" fill="#08141c" font-weight="bold">Shop Now ↗</text>

    <text x="35" y="290" font-family="sans-serif" font-size="8" fill="#aebfc0">Reels · TikTok · Shorts</text>
  </g>

  <!-- Stats Column -->
  <g transform="translate(625, 95)">
    <rect width="130" height="80" rx="4" fill="#102431" stroke="#efa75c" stroke-opacity="0.4"/>
    <text x="15" y="32" font-family="sans-serif" font-size="20" fill="#efa75c" font-weight="bold">&lt; 10s</text>
    <text x="15" y="52" font-family="sans-serif" font-size="9" fill="#aebfc0">Turnaround Time</text>
    <text x="15" y="68" font-family="sans-serif" font-size="8" fill="#58d1be">Async Queue</text>

    <rect y="95" width="130" height="80" rx="4" fill="#102431" stroke="#58d1be" stroke-opacity="0.4"/>
    <text x="15" y="127" font-family="sans-serif" font-size="20" fill="#58d1be" font-weight="bold">9:16</text>
    <text x="15" y="147" font-family="sans-serif" font-size="9" fill="#aebfc0">Vertical HD MP4</text>
    <text x="15" y="163" font-family="sans-serif" font-size="8" fill="#aebfc0">Social Optimized</text>

    <rect y="190" width="130" height="75" rx="4" fill="#102431" stroke="#aebfc0" stroke-opacity="0.3"/>
    <text x="15" y="222" font-family="sans-serif" font-size="20" fill="#ffffff" font-weight="bold">&lt; 150ms</text>
    <text x="15" y="242" font-family="sans-serif" font-size="9" fill="#aebfc0">Edge TTFB Global</text>
  </g>
</svg>
