    <line x1="35" y1="175" x2="35" y2="195" stroke="#58d1be" stroke-width="2"/>
    <line x1="42" y1="175" x2="42" y2="195" stroke="#58d1be" stroke-width="3"/>
    <line x1="50" y1="175" x2="50" y2="195" stroke="#58d1be" stroke-width="1"/>
    <line x1="56" y1="175" x2="56" y2="195" stroke="#58d1be" stroke-width="4"/>
    <line x1="66" y1="175" x2="66" y2="195" stroke="#58d1be" stroke-width="2"/>
    <line x1="74" y1="175" x2="74" y2="195" stroke="#58d1be" stroke-width="1"/>
    <line x1="82" y1="175" x2="82" y2="195" stroke="#58d1be" stroke-width="3"/>
    <line x1="92" y1="175" x2="92" y2="195" stroke="#58d1be" stroke-width="2"/>
    <line x1="102" y1="175" x2="102" y2="195" stroke="#58d1be" stroke-width="4"/>
    <line x1="112" y1="175" x2="112" y2="195" stroke="#58d1be" stroke-width="1"/>
    <line x1="120" y1="175" x2="120" y2="195" stroke="#58d1be" stroke-width="2"/>
    <line x1="130" y1="175" x2="130" y2="195" stroke="#58d1be" stroke-width="3"/>
    <line x1="140" y1="175" x2="140" y2="195" stroke="#58d1be" stroke-width="2"/>
  </g>

  <!-- Arrow -->
