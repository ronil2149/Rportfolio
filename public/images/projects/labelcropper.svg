    <rect x="15" y="45" width="150" height="70" rx="2" fill="#1a374a"/>
    <text x="25" y="75" font-family="sans-serif" font-size="9" fill="#aebfc0" fill-opacity="0.7">Tax Invoice &amp; Manifest</text>
    <text x="25" y="92" font-family="sans-serif" font-size="8" fill="#efa75c">Stripped locally in Web Worker</text>
    
    <!-- Cut label box inside A4 -->
