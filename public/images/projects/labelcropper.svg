<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1d29"/>
      <stop offset="100%" stop-color="#061017"/>
    </linearGradient>
    <linearGradient id="mintGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58d1be" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#58d1be" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#efa75c"/>
      <stop offset="100%" stop-color="#ffbf75"/>
