  </defs>

  <rect width="800" height="450" rx="8" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="448" rx="7" fill="none" stroke="#58d1be" stroke-opacity="0.2"/>

  <!-- Top bar -->
