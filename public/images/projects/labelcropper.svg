      <line x1="12" y1="5" x2="12" y2="55" stroke="#ffffff" stroke-width="4"/>
      <line x1="20" y1="5" x2="20" y2="55" stroke="#ffffff" stroke-width="1"/>
      <line x1="26" y1="5" x2="26" y2="55" stroke="#ffffff" stroke-width="3"/>
      <line x1="34" y1="5" x2="34" y2="55" stroke="#ffffff" stroke-width="5"/>
      <line x1="44" y1="5" x2="44" y2="55" stroke="#ffffff" stroke-width="2"/>
      <line x1="52" y1="5" x2="52" y2="55" stroke="#ffffff" stroke-width="1"/>
      <line x1="60" y1="5" x2="60" y2="55" stroke="#ffffff" stroke-width="4"/>
      <line x1="70" y1="5" x2="70" y2="55" stroke="#ffffff" stroke-width="2"/>
      <line x1="80" y1="5" x2="80" y2="55" stroke="#ffffff" stroke-width="5"/>
      <line x1="92" y1="5" x2="92" y2="55" stroke="#ffffff" stroke-width="1"/>
      <line x1="100" y1="5" x2="100" y2="55" stroke="#ffffff" stroke-width="3"/>
      <line x1="110" y1="5" x2="110" y2="55" stroke="#ffffff" stroke-width="4"/>
      <line x1="120" y1="5" x2="120" y2="55" stroke="#ffffff" stroke-width="2"/>
      <line x1="130" y1="5" x2="130" y2="55" stroke="#ffffff" stroke-width="3"/>
      <line x1="140" y1="5" x2="140" y2="55" stroke="#ffffff" stroke-width="4"/>
      <line x1="150" y1="5" x2="150" y2="55" stroke="#ffffff" stroke-width="2"/>
      <text x="45" y="70" font-family="monospace" font-size="9" fill="#aebfc0">PKG-84920481-CA</text>
    </g>

    <rect x="15" y="230" width="180" height="35" rx="3" fill="#142c3d"/>
    <text x="25" y="252" font-family="sans-serif" font-size="9" fill="#efa75c" font-weight="bold">100% Thermal Printer Ready</text>
  </g>

  <!-- Metrics badge panel -->
  <g transform="translate(615, 90)">
    <rect width="130" height="80" rx="4" fill="#102431" stroke="#58d1be" stroke-opacity="0.4"/>
    <text x="15" y="28" font-family="sans-serif" font-size="18" fill="#58d1be" font-weight="bold">50K+</text>
    <text x="15" y="46" font-family="sans-serif" font-size="9" fill="#aebfc0">Monthly Visits</text>
    <text x="15" y="64" font-family="sans-serif" font-size="8" fill="#efa75c">Active Production</text>

    <rect y="95" width="130" height="80" rx="4" fill="#102431" stroke="#efa75c" stroke-opacity="0.4"/>
    <text x="15" y="123" font-family="sans-serif" font-size="18" fill="#efa75c" font-weight="bold">$0</text>
    <text x="15" y="141" font-family="sans-serif" font-size="9" fill="#aebfc0">Server Compute</text>
    <text x="15" y="159" font-family="sans-serif" font-size="8" fill="#58d1be">Client-Side PDF-Lib</text>

    <rect y="190" width="130" height="80" rx="4" fill="#102431" stroke="#58d1be" stroke-opacity="0.4"/>
    <text x="15" y="218" font-family="sans-serif" font-size="18" fill="#58d1be" font-weight="bold">90+</text>
    <text x="15" y="236" font-family="sans-serif" font-size="9" fill="#aebfc0">Lighthouse Score</text>
    <text x="15" y="254" font-family="sans-serif" font-size="8" fill="#aebfc0">WCAG 2.1 AA</text>
  </g>
