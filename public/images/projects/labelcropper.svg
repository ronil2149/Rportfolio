    <text x="25" y="102" font-family="sans-serif" font-size="8" fill="#58d1be">Routing Code: TOR-ON-M4B · Express 2-Day</text>
    <text x="25" y="116" font-family="sans-serif" font-size="8" fill="#aebfc0">SKU: WIDGET-01 x 2 · PICKLIST #4092</text>

    <!-- Large Thermal Barcode -->
