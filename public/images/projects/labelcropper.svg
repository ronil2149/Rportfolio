  <circle cx="68" cy="42" r="5" fill="#58d1be" fill-opacity="0.8"/>
  <circle cx="86" cy="42" r="5" fill="#aebfc0" fill-opacity="0.5"/>
  <text x="110" y="47" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" fill="#aebfc0" letter-spacing="0.05em">lablecropper.com — Client-Side 4x6 Thermal Label Engine</text>

  <!-- Left: A4 Input Sheet -->
  <g transform="translate(60, 90)">
